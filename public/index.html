.eq{display:flex;align-items:flex-end;justify-content:center;gap:5px;height:26px;margin-bottom:18px}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.accent{background:linear-gradient(90deg,var(--red-soft),var(--gold),var(--red-soft));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
.theme-toggle{position:fixed;top:16px;right:16px;z-index:50;width:40px;height:40px;border-radius:50%;background:var(--elev);border:1px solid var(--border);color:var(--dim);cursor:pointer;transition:all .25s var(--ease)}

.wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:2rem 1.1rem 3rem}
header{text-align:center;margin-bottom:2rem}

.logo-ring::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px dashed rgba(242,193,78,.35);animation:spin 20s linear infinite reverse}
.logo-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#000;animation:spin 8s linear infinite reverse}
.brand{font-family:'IBM Plex Sans Arabic',sans-serif;letter-spacing:.2em;font-size:.8rem;color:var(--dim);margin-bottom:10px}
.hbox{position:relative;border-radius:24px;padding:1px;overflow:hidden;max-width:520px;margin:0 auto}

.brand{margin-bottom:4px!important}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}

document.querySelectorAll(".logo-slot").forEach(e=>e.innerHTML=logoSVG(e.dataset.s||"a"));

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BI={download:"fa-solid fa-download",video:"fa-solid fa-circle-play",link:"fa-solid fa-arrow-up-right-from-square"};

try{if(localStorage.getItem("theme")==="light")document.body.classList.add("light")}catch{}
const setIcon=()=>$("theme").firstElementChild.className=document.body.classList.contains("light")?"fa-solid fa-moon":"fa-solid fa-sun";
setIcon();
$("theme").onclick=()=>{document.body.classList.toggle("light");try{localStorage.setItem("theme",document.body.classList.contains("light")?"light":"dark")}catch{}setIcon()};

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1800)}

async function getData(){
  for(const u of ["api/data","data.json"]){try{const r=await fetch(u);if(!r.ok)continue;const d=await r.json();if(d&&Array.isArray(d.cards))return d}catch{}}
  return FALLBACK;
}
getData().then(d=>{
  document.title=d.title+" | "+d.brand;
  $("brand").textContent=d.brand;
  $("title").innerHTML=esc(d.title).replace(/([A-Za-z0-9][A-Za-z0-9 ]*)/,'<span class="accent">$1</span>');
  $("sub").textContent=d.subtitle;
  $("footer").textContent=d.footer;
  $("cards").innerHTML=d.cards.map((c,i)=>`
  <article class="card" style="animation-delay:${Math.min(i,8)*70}ms"><div class="card-in">
    <div class="top-row"><span class="badge">${esc(c.badge)}</span><span class="tag">${esc(c.tag)}</span></div>
    <div class="ico"><i class="${esc(c.icon)}"></i></div>
    <h2>${esc(c.title)}</h2>
    ${c.notice?`<div class="notice"><i class="fa-solid fa-circle-info"></i><span>${esc(c.notice)}</span></div>`:""}
    ${c.steps.length?`<div class="lbl">الخطوات</div><ol>${c.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join("")}</ol>`:""}
    ${c.servers.map(s=>`<div class="srv"><button class="copy" data-v="${esc(s.value)}"><i class="fa-regular fa-copy"></i> نسخ</button><div class="meta"><small>${esc(s.label)}</small><b>${esc(s.value)}</b></div></div>`).join("")}
    ${c.buttons.length?`<div class="btns">${c.buttons.map(b=>`<a class="btn ${esc(b.type)}${b.url?"":" off"}" ${b.url?`href="${esc(b.url)}" target="_blank" rel="noopener"`:""}><i class="${BI[b.type]||BI.link}"></i> ${esc(b.text)}</a>`).join("")}</div>`:""}
  </div></article>`).join("");
}).catch(()=>{$("cards").innerHTML='<p style="text-align:center;color:var(--dim)">تعذر تحميل البيانات</p>'});

document.addEventListener("click",async e=>{
  const b=e.target.closest(".copy");if(!b)return;
  try{await navigator.clipboard.writeText(b.dataset.v)}catch{const t=document.createElement("textarea");t.value=b.dataset.v;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
  toast("تم النسخ: "+b.dataset.v);
  b.classList.add("done");b.innerHTML='<i class="fa-solid fa-check"></i> تم';
  setTimeout(()=>{b.classList.remove("done");b.innerHTML='<i class="fa-regular fa-copy"></i> نسخ'},1500);
});

/* توهج المؤشر + جزيئات (نفس موقع الاختصار) */
if(matchMedia("(hover:hover) and (pointer:fine)").matches&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
  const g=document.getElementById("glow");addEventListener("mousemove",e=>{g.style.opacity=1;g.style.left=e.clientX+"px";g.style.top=e.clientY+"px"});
}
(function(){
  const c=document.getElementById("particles"),x=c.getContext("2d");let w,h;
  const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight};rs();addEventListener("resize",rs);
  const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const P=Array.from({length:innerWidth<600?18:36},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+.6,s:Math.random()*.35+.12,d:(Math.random()-.5)*.25,c:Math.random()>.5?"255,15,43":"242,193,78",a:Math.random()*.3+.08}));
  (function draw(){x.clearRect(0,0,w,h);P.forEach(p=>{x.beginPath();x.fillStyle=`rgba(${p.c},${p.a})`;x.arc(p.x,p.y,p.r,0,6.283);x.fill();if(!reduced){p.y-=p.s;p.x+=p.d;if(p.y<-10){p.y=h+10;p.x=Math.random()*w}}});requestAnimationFrame(draw)})();
})();
</script>
</body>
</html>
